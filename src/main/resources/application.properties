spring.application.name=pedidos

server.port=8082

# Base de datos exclusiva de pedidos (RDS MySQL nuevo)
spring.datasource.url=jdbc:mysql://pedidos-db.c9mjwjitwufm.us-eagit -1.rds.amazonaws.com:3306/pedidos
spring.datasource.username=admin
spring.datasource.password=adminadmin

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ en EC2
spring.rabbitmq.host=3.84.178.81
spring.rabbitmq.port=5672
spring.rabbitmq.username=ventas_consumidor
spring.rabbitmq.password=admin
spring.rabbitmq.virtual-host=ventas
spring.rabbitmq.connection-timeout=5s

# Consumir un mensaje a la vez
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Confirmar después de procesar correctamente
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=true

# Cola existente
app.rabbitmq.queue=ventas.queue